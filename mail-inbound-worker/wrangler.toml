name = "mail-inbound-worker"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# The app endpoint that receives parsed attachments. Point it at the live Pages
# project (or a preview URL while testing).
[vars]
INBOUND_API_URL = "https://moses-caffee.pages.dev/api/inbound"

# INBOUND_SECRET is a SECRET, not a var — set it with:
#   npx wrangler secret put INBOUND_SECRET
# and set the SAME value on the Pages project (Settings → Environment variables).
